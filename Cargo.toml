[package]
name        = "cisak"
version     = "0.1.14"
edition     = "2021"
description = "Container Installation - Swiss Army Knife: automates download, verification, and installation of runc, CNI plugins, and containerd"
license     = "MIT"
repository  = "https://github.com/rodolfovillaruz/cisak"
readme      = "README.md"
keywords    = ["container", "runc", "containerd", "cni", "oci"]
categories  = ["command-line-utilities", "development-tools"]
exclude     = [".dump"]

[[bin]]
name = "cisak"
path = "src/main.rs"

# ── cargo-binstall ───────────────────────────────────────────────────────────
# Maps targets to the archives produced by .github/workflows/release.yaml.
[package.metadata.binstall]
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-linux-amd64{ archive-suffix }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-linux-amd64-gnu{ archive-suffix }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-linux-arm64{ archive-suffix }"

[dependencies]
clap     = { version = "4",     features = ["derive"] }
serde    = { version = "1",     features = ["derive"] }
toml     = "1.1.2"
anyhow   = "1"
tempfile = "3"
colored = "3.1.1"
serde_json = "1.0.149"
